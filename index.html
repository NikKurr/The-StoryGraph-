<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Трекер прочитаних книг</title>
        <script src="js/script.js" defer></script>
        <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Трекер прочитаних книг</h1>
      <nav>
        <!-- <a href="#add-book">Додати книгу</a> -->
      </nav>
    </header>
    <div class="layout">
      <main>
        <section>
          <h2>Додати книгу</h2>

          <form>
            <label for="title">Назва книги:</label>
            <input type="text" id="title" />

            <label for="author">Автор:</label>
            <input type="text" id="author" />

            <label for="year">Рік видання:</label>
            <input type="number" id="year" />

            <button type="submit">Додати книгу</button>
          </form>
        </section>
        <section>
          <h2>Мої книги</h2>
          <div class="cards">
            <article>
              <div class="book-cover"></div>
              <h3>Маленький принц</h3>
              <p>Автор: Антуан де Сент-Екзюпері</p>
              <p>Рік видання: 1942</p>
              <span class="book-status book-status--done">Прочитано</span>
            </article>
            <article>
              <div class="book-cover"></div>
              <h3>На західному фронті без змін</h3>
              <p>Автор: Еріх Марія Ремарк</p>
              <p>Рік видання: 1929</p>
              <span class="book-status book-status--done">Прочитано</span>
            </article>
          </div>
        </section>
      </main>

      <aside>
        <h2>Статистика читання</h2>
        <p>Всього книг: 2</p>
        <p>Прочитано: 2</p>
        <p>У процесі: 0</p>
      </aside>
    </div>

    <footer>
      <p>Автор: Нікіта Кусенко</p>
    </footer>
  </body>
</html>
